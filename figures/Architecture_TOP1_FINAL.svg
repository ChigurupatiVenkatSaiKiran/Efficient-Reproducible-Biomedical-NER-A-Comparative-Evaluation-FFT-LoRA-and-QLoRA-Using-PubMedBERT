<text x="400" y="192" text-anchor="middle" font-size="9.5" fill="#555">BIO label mapping  ·  WordPiece subword alignment  ·  max 128 tokens  ·  DataCollatorForTokenClassification</text>
<line x1="400" y1="216" x2="400" y2="238" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
