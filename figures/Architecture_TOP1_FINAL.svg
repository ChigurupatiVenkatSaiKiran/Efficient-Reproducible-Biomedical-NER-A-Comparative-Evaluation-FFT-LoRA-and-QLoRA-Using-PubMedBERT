<svg width="800" height="700" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00000015"/></filter>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C0392B"/><stop offset="1" stop-color="#E74C3C"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16A085"/><stop offset="1" stop-color="#1ABC9C"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C3483"/><stop offset="1" stop-color="#8E44AD"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A5276"/><stop offset="1" stop-color="#2980B9"/></linearGradient>
  <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#784212"/><stop offset="1" stop-color="#D35400"/></linearGradient>
  <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E8449"/><stop offset="1" stop-color="#27AE60"/></linearGradient>
</defs>
<rect width="800" height="700" fill="#F0F2F5"/>
<!-- TITLE BAR -->
<rect x="0" y="0" width="800" height="46" fill="#1a1a2e"/>
<text x="400" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="white">Efficient Fine-Tuning of PubMedBERT for Biomedical Named Entity Recognition</text>
<text x="400" y="34" text-anchor="middle" font-size="9.5" fill="#aab">Full Fine-Tuning  vs  LoRA  vs  QLoRA  ·  BC5CDR Dataset  ·  Data-size Ablation  ·  2 Seeds</text>
<!-- PHASE RAIL -->
<rect x="46" y="54" width="1" height="624" fill="#ccc"/>
<text x="26" y="108" font-size="8" fill="#aaa" text-anchor="middle" transform="rotate(-90,26,108)">INPUT</text>
<text x="26" y="204" font-size="8" fill="#aaa" text-anchor="middle" transform="rotate(-90,26,204)">PREPROCESS</text>
<text x="26" y="300" font-size="8" fill="#aaa" text-anchor="middle" transform="rotate(-90,26,300)">BACKBONE</text>
<text x="26" y="430" font-size="8" fill="#aaa" text-anchor="middle" transform="rotate(-90,26,430)">FINE-TUNING</text>
<text x="26" y="546" font-size="8" fill="#aaa" text-anchor="middle" transform="rotate(-90,26,546)">EVALUATION</text>
<text x="26" y="640" font-size="8" fill="#aaa" text-anchor="middle" transform="rotate(-90,26,640)">OUTPUT</text>
<!-- ROW 1: BC5CDR -->
<rect x="260" y="66" width="280" height="64" rx="8" fill="white" filter="url(#sh)"/>
<rect x="260" y="66" width="280" height="10" rx="8" fill="url(#g1)"/>
