<text x="400" y="278" text-anchor="middle" font-size="9.5" fill="#555">microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract  ·  110 M parameters  ·  12 Transformer layers</text>
<!-- branch arrows -->
<path d="M218 302 L218 326 L202 326 L202 348" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="400" y1="302" x2="400" y2="348" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M582 302 L582 326 L598 326 L598 348" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
