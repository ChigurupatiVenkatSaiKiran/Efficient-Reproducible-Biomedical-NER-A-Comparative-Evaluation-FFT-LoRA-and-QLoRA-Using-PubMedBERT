<text x="400" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">BC5CDR Dataset</text>
<text x="400" y="106" text-anchor="middle" font-size="9.5" fill="#555">Chemical &amp; Disease NER  ·  16,400 sentences  ·  5 BIO labels</text>
<line x1="400" y1="130" x2="400" y2="152" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<!-- ROW 2: PREPROCESS -->
<rect x="120" y="152" width="560" height="64" rx="8" fill="white" filter="url(#sh)"/>
