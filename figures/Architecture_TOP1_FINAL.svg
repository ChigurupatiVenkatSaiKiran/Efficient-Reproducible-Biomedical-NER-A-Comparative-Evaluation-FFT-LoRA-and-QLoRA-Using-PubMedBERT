<rect x="68" y="348" width="228" height="120" rx="8" fill="white" filter="url(#sh)"/>
<rect x="68" y="348" width="228" height="10" rx="8" fill="url(#g4)"/>
<rect x="68" y="354" width="228" height="4" fill="url(#g4)"/>
<text x="182" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Full Fine-Tuning</text>
<line x1="82" y1="382" x2="282" y2="382" stroke="#eee" stroke-width="1"/>
<text x="182" y="398" text-anchor="middle" font-size="9.5" fill="#333">All 110 M params updated</text>
<text x="182" y="414" text-anchor="middle" font-size="9.5" fill="#333">LR 2e-5  ·  cosine schedule</text>
<text x="182" y="430" text-anchor="middle" font-size="9.5" fill="#333">batch 32  ·  epochs 4</text>
<text x="182" y="446" text-anchor="middle" font-size="9" fill="#888">seeds 42, 123  ·  early stopping</text>
<text x="182" y="461" text-anchor="middle" font-size="9" fill="#888">gradient checkpointing</text>
<rect x="308" y="348" width="184" height="120" rx="8" fill="white" filter="url(#sh)"/>
<rect x="308" y="348" width="184" height="10" rx="8" fill="url(#g5)"/>
<rect x="308" y="354" width="184" height="4" fill="url(#g5)"/>
<text x="400" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">LoRA</text>
<line x1="322" y1="382" x2="478" y2="382" stroke="#eee" stroke-width="1"/>
<text x="400" y="398" text-anchor="middle" font-size="9.5" fill="#333">Rank r=32  ·  alpha=64</text>
<text x="400" y="414" text-anchor="middle" font-size="9.5" fill="#333">Q, K, V, dense adapters</text>
<text x="400" y="430" text-anchor="middle" font-size="9.5" fill="#333">2.2 M trainable params</text>
<text x="400" y="446" text-anchor="middle" font-size="9.5" fill="#333">LR 3e-4  ·  cosine schedule</text>
<text x="400" y="461" text-anchor="middle" font-size="9" fill="#888">seeds 42, 123  ·  early stopping</text>
<rect x="504" y="348" width="228" height="120" rx="8" fill="white" filter="url(#sh)"/>
<rect x="504" y="348" width="228" height="10" rx="8" fill="url(#g6)"/>
<rect x="504" y="354" width="228" height="4" fill="url(#g6)"/>
<text x="618" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">QLoRA</text>
<line x1="518" y1="382" x2="718" y2="382" stroke="#eee" stroke-width="1"/>
<text x="618" y="398" text-anchor="middle" font-size="9.5" fill="#333">4-bit NF4 quantisation</text>
<text x="618" y="414" text-anchor="middle" font-size="9.5" fill="#333">double quantisation enabled</text>
<text x="618" y="430" text-anchor="middle" font-size="9.5" fill="#333">LoRA r=32  ·  2.2 M params</text>
<text x="618" y="446" text-anchor="middle" font-size="9.5" fill="#333">LR 3e-4  ·  cosine schedule</text>
<text x="618" y="461" text-anchor="middle" font-size="9" fill="#888">seeds 42, 123  ·  early stopping</text>
<!-- converge -->
<path d="M182 468 L182 504 L398 504" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="400" y1="468" x2="400" y2="504" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M618 468 L618 504 L402 504" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
